name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # 방어용: verify.mjs 가 모든 단계에 차단 env 를 넣지만, 래퍼 밖에서 도는 명령(npm ci 등)도 운영 DB 에 닿지 않도록
      # job 수준에도 차단 주소를 둔다. 값은 scripts/lib/blocked-db.mjs 의 BLOCKED_DB_URL 과 같다(YAML 이라 import 불가).
      POSTGRES_URL: postgres://blocked:blocked@127.0.0.1:1/blocked
      POSTGRES_PRISMA_URL: postgres://blocked:blocked@127.0.0.1:1/blocked
      POSTGRES_URL_NON_POOLING: postgres://blocked:blocked@127.0.0.1:1/blocked
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'contents/**', 'next.config.js') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # 로컬 `npm run verify` 와 같은 단계(scripts/verify.mjs): prisma generate → tsc → eslint → content:check --strict
      # → test:hooks → test:content → next build → smoke. 단계를 바꿀 때는 verify.mjs 만 고친다.
      - name: verify
        run: npm run verify
